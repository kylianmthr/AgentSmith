[project]
name = "agentsmith"
version = "0.1.0"
description = "Autonomous reasoning, code generation, and execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"fastmcp>=3.4,<4",
	"mcp>=1.28.1,<1.29",
	"openai>=2.46.0",
	"pydantic>=2.13.4",
	"pytest>=9.1.1",
]

[project.scripts]
sandbox = "agent_smith.sandbox.repl:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_smith*", "agent_mbpp*", "agent_swebench*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: start a real server",
    "slow: try to timeout",
]
