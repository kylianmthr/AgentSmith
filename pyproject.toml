[project]
name = "agentsmith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.46.0",
    "mcp>=1.28.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: start a real server", "slow: try to timeout"]
